<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de Usuários</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="card shadow border-0 rounded-4 overflow-hidden">

      <div class="bg-primary text-white text-center py-4">
        <h1 class="h2 fw-bold m-0">Lista de Usuários</h1>
      </div>

      <div class="card-body p-4">

        <form id="formBusca" class="input-group mb-3">
          <input type="text" id="busca" class="form-control"
                 placeholder="Buscar por nome (deixe vazio para listar todos)">
          <button class="btn btn-primary px-4" type="submit">Buscar</button>
        </form>

        <p class="mb-3">
          Usuários encontrados:
          <strong id="total" class="text-primary">0</strong>
        </p>

        <div id="mensagem"></div>

        <div class="table-responsive">
          <table class="table table-striped table-bordered text-center align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Login</th>
                <th>Logado</th>
              </tr>
            </thead>
            <tbody id="tabela"></tbody>
          </table>
        </div>

      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
